name: web
on:
  pull_request:
    paths: ['apps/web/**', 'packages/**', '.github/workflows/web.yml']
  push:
    branches: [main]
    paths: ['apps/web/**', 'packages/**']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - if: hashFiles('apps/web/package.json') != ''
        run: npm ci && npm run typecheck && npm run lint && npm test && npm run build
